data_inputs: "CDC weekly flu hospital admissions (NHSN)"
methods: "ARIMA Forecast Model."
methods_long: "ARIMA is a classical time series model that represents the current value of a
  series as a linear function of its own recent values (autoregressive terms) and
  recent forecast errors (moving average terms), after differencing to remove
  trend. Model orders are selected automatically for each reference date using
  auto.arima() on an expanding window of weekly hospital admissions, and 1- to
  3-week-ahead predictive intervals are converted to the required quantiles."
