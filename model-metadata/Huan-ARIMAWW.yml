data_inputs: "CDC weekly US flu hospital admissions (NHSN); NWSS national wastewater influenza A viral activity level (WVAL)"
methods: "Regression with ARIMA errors (ARIMAX) using wastewater as a regressor."
methods_long: "forecast::auto.arima fit to weekly US influenza hospital admissions
  with the NWSS national wastewater viral activity level (WVAL) as an external
  regressor, on an expanding window (2024-07 onward) refit at each reference date.
  Future WVAL is forecast forward with its own auto.arima and supplied as the
  future regressor. Forecasts 1-3 weeks ahead, clamped at zero and rounded to
  integer counts."
