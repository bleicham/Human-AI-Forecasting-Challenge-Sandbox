designated_model: true
data_inputs: >-
  Finalized national NHSN weekly influenza hospital admissions.
methods: >-
  Expanding-window auto-ARIMA forecasts for 1-, 2-, and 3-week horizons.
methods_long: >-
  For each reference date, an auto-ARIMA model was fit to all national
  weekly influenza admissions available through that date. A single
  three-step forecast supplied horizons 1-3. Twenty-three non-negative
  quantiles were obtained from the fitted Gaussian forecast distribution.
