designated_model: true
data_inputs: "CDC NHSN weekly influenza hospital admissions; Activity 5 ensemble and Activity 7 tuned XGBoost component forecasts."
methods: "Horizon-specific hybrid: XGBoost blend for horizon 1 and tuned XGBoost quantiles for horizons 2 and 3."
methods_long: "Expanding-window, leakage-controlled direct quantile XGBoost forecasts use recent admissions lags and MMWR seasonal harmonics. The selected hybrid uses the validated Activity 7 XGBoost blend for the one-week horizon and raw tuned XGBoost for two- and three-week horizons. Quantiles are reconciled to be nonnegative, integer-valued, and monotone. The model was selected by held-out weighted interval score across the 2025-26 retrospective season."
