data_inputs: "CDC weekly US flu hospital admissions (NHSN); NWSS national wastewater influenza A viral activity level (WVAL)"
methods: "XGBoost quantile regression on admissions and wastewater features."
methods_long: "Gradient-boosted regression trees (XGBoost, reg:quantileerror)
  predicting log1p weekly admissions at horizons 1-3 from recent admissions
  (current, 1- and 2-week lags, momentum) plus the NWSS national wastewater viral
  activity level (WVAL: current value, 1-week lag, and momentum). Direct
  per-horizon models refit on an expanding window (2024-07 onward) at each
  reference date; 23 quantiles per horizon, back-transformed, clamped at zero and
  rounded to integer counts. Team-designated primary model."
